name: Update public ACS locker directory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Build merged ACS directory
        env:
          ACS_SECOND_SOURCE_URL: ${{ vars.ACS_SECOND_SOURCE_URL }}
        run: python update_acs_lockers.py
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acs-lockers.json
          git diff --cached --quiet || (git commit -m 'Update ACS locker directory' && git push)
